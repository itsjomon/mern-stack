<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Alpha Channel -->
    <div id="alpha">
        <h3>heading</h3>
    </div>

    <!-- Opacity -->
    <div id="opacity">
        <h3>heading</h3>
        <button>click</button>
    </div>
    <hr>

    <!-- Transition -->
    <div id="transition"></div>
    <hr>

    <section id="section">
        <div class="transform" id="one">1</div>
        <div class="transform" id="two">2</div>
        <div class="transform" id="three">3</div>
        <div class="transform" id="four">4</div>
        <div class="transform" id="five">5</div>
    </section>
    <hr>

    <!-- Box Shadow -->
    <div id="shadow"></div>
    <hr>

    <!-- Background Image -->
    <div id="bg">
        <p>hello</p>
    </div>
    <hr>

    <!-- Card Hover Effect -->
    <div class="card">
        <!-- Photo by Muhammed Avcı on Unsplash (https://unsplash.com/photos/four-white-geese-swim-in-a-lake-with-buildings-behind-t--8lhlf8qo) -->
        <img src="assets/img.jpg" alt="card 1">
        <h3 class="disc">Card 1</h3>
        <p class="disc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
    </div>
    <div class="card">
        <!-- Photo by Muhammed Avcı on Unsplash (https://unsplash.com/photos/four-white-geese-swim-in-a-lake-with-buildings-behind-t--8lhlf8qo) -->
        <img src="assets/img.jpg" alt="card 2">
        <h3 class="disc">Card 2</h3>
        <p class="disc">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
    </div>
    <hr>

    <!-- Position Property -->
    <section>
        <h2>Static Demo</h2>
        <div class="position">1</div>
        <div class="position">1</div>
        <div class="position" id="static">1</div>
    </section>
    <hr>
    <section>
        <h2>Relative Demo</h2>
        <div class="position">2</div>
        <div class="position">2</div>
        <div class="position" id="relative">2</div>
    </section>
    <hr>
    <section>
        <h2>Absolute Demo</h2>
        <div class="position">3</div>
        <div class="position">3</div>
        <div class="position" id="absolute">3</div>
    </section>
    <hr>
    <section>
        <h2>Fixed Demo</h2>
        <div class="position">4</div>
        <div class="position">4</div>
        <div class="position" id="fixed">4</div>
    </section>
</body>
</html>
