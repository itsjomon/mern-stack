<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Block elements -->
    <h1>Hello World!</h1>
    <h2>SDE</h2>
    <p>Lorem ipsum dolor sit amet.</p>

    <!-- Inline elements -->
    <a href="#">YouTube</a>
    <a href="#">Google</a>
    <img src="image.png" alt="Image">
    <img src="image2.png" alt="Image 2">
</body>
</html>

<!-- A block element takes the full available width (whole block) and starts on a new line. -->
<!-- Examples of block elements: div, p, h1, h2, h3, ul, ol, li, table, header, footer, section, article, nav, etc. -->

<!-- An inline element takes up only the necessary width and does not start on a new line. -->
<!-- Examples of inline elements: a, span, img, br, etc. -->
