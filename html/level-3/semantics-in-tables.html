<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>Food Menu</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10.00</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>25.00</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td>Total</td>
                <td>35.00</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>

<!-- <thead></thead> to wrap table header, <tbody></tbody> to wrap table body, and <tfoot></tfoot> to wrap table footer -->
