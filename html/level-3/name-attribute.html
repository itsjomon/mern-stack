<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/action.php">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your username" name="user">
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" name="pass">
        </div>
        <button>Submit</button>
    </form>

    <hr>

    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="Search in YouTube" name="search_query">
        <button>Search</button>
    </form>
</body>
</html>

<!-- Name Attribute: Name of the form control. Submitted with the form as part of a name/value pair

<input type="text" placeholder="Enter your username" id="username" name="user"/> -->
