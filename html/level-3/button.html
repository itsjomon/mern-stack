<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/action.php">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter your username">
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <!-- Button Element -->
        <button>Submit 1</button> <!-- Submit is the default type for a button inside an HTML form -->
        <button type="submit">Submit 2</button>
        <button type="button">Submit 3</button> <!-- Change type to submit to perform action -->
        <button type="reset">Reset</button>

        <!-- Button Using Input -->
        <input type="button" value="Click me"> <!-- Change type to submit to perform action -->
        <input type="submit" value="Click me">
    </form>
</body>
</html>

<!-- Button element is used to create clickable buttons. The input element with type attribute set to button, submit or reset can also be used to create buttons. -->

<!-- The main purpose of a button in an HTML form is to submit form data to a server for processing. -->
