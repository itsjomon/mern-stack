<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <!-- Unordered list -->
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
    </ul>

    <!-- Ordered list -->
    <ol>
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
    </ol>

    <!-- Ordered list with attributes-->
    <ol type="a">
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
    </ol>
    
    <ol type='i'>
        <li>Mango</li>
        <li>Apple</li>
        <li>Orange</li>
    </ol>
</body>
</html>
