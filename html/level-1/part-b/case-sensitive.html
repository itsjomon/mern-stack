<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Main Heading</H1>
    <h2>Subheading</H2>
    <p>This is a paragraph</p>
</body>
</html>

<!-- HTML is not case-sensitive. Both <H1> and <h1> work the same way. However, using lowercase is the standard practice. -->
