<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tag</title>
</head>
<body>
    <!-- Anchor tag --> 
    <a href="https://www.google.com/">Google</a> <!-- Absolute link -->
    <a href="lists.html">Lists</a> <!-- Relative link -->
</body>
</html>

<!-- Anchor tag is used to create hyperlinks in an HTML document. It is defined using the <a> tag and requires the 'href' attribute to specify the destination URL or path of the link. -->

<!-- href (hypertext reference) -->

<!-- Absolute link: links from the internet. -->
<!-- Relative link: file or folder within the same website. -->
