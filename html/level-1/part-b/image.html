<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Image tag -->
    <img src="image.png" alt="Random image"> <!-- Relative link -->
    <!-- Image is not displayed because it is just an example and the image does not exist. -->

    <!-- Use absolute link: src="https://example.com/image.png" (full URL from another website) -->
</body>
</html>

<!-- Image tag is used to embed images in an HTML document. It is defined using the <img> tag and requires the 'src' attribute to specify the path to the image file. The 'alt' attribute provides alternative text for the image, which is displayed if the image cannot be loaded. -->
