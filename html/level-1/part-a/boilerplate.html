<!DOCTYPE html> <!-- HTML version (HTML5) -->
<html lang="en"> <!-- HTML tag (root tag) -->
<head> <!-- Stores metadata (data about data) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- Title tag to display the name of the website -->
</head>
<body> <!-- Body tag -->
    <p>Hello World!</p> <!-- Paragraph tag -->
</body>
</html>

<!-- Indentation refers to adding proper spaces or tabs at the beginning of lines to improve code readability and structure. -->
